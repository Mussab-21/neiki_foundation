<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate | NEIKI Sub Say Foundation</title>
  <meta name="description" content="Support NEIKI Foundation's clean water and food security projects across Pakistan.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    .donate-page-container {
      padding: 6rem 2rem;
      text-align: center;
      background-color: var(--color-bg-light);
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .donate-img-wrapper {
      max-width: 800px;
      width: 100%;
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      margin-bottom: 3rem;

    .donate-img-wrapper img {
      width: 100%;
      height: auto;
      display: block;

    .donate-text {

    .donate-text h1 {

    <div class="container header-inner">
      <a href="index.html" class="nav-brand">
        <img src="assets/img/neiki_logo_white_transparent.webp" alt="NEIKI Sub Say Foundation" class="header-logo" width="1469" height="1556">
